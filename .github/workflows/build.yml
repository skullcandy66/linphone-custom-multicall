name: Linphone Custom Build (10-Call & Bubble Overlay)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      linphone_branch:
        description: 'Linphone Android Branch/Tag from GitLab (e.g. master, 6.2.10, release/5.2)'
        required: false
        default: 'master'
      build_type:
        description: 'Build Type (debug or release)'
        required: false
        default: 'debug'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Custom Linphone APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Accept Android SDK Licenses
        run: |
          mkdir -p "$ANDROID_HOME/licenses" || true
          printf "89337d1250775148b1dd817016b918fa7903e093\n24333f8a63b6825ea9c5514f83c2829b004d1fee\nd56f5187479451eabf01fb78af6dfcb131a6481e\n84831b9409646a33ee33ee30217559483737b666\n" > "$ANDROID_HOME/licenses/android-sdk-license" || true
          printf "84831b9409646a33ee33ee30217559483737b666\n" > "$ANDROID_HOME/licenses/android-sdk-preview-license" || true
          printf "7907f711f11926ee4ca99b4070ec07ac5d259424\n" > "$ANDROID_HOME/licenses/android-sdk-arm-dbt-license" || true
          printf "601085b94cd77f0b54ff864069554494414c4d6d\n" > "$ANDROID_HOME/licenses/android-googletv-license" || true
          printf "33b6a2b6492040b8007ea52c3f0447abec801192\n" > "$ANDROID_HOME/licenses/google-gdk-license" || true
          printf "e9acab583f1529a499d0fbde8d402a7b0873d04d\n" > "$ANDROID_HOME/licenses/mips-android-sysimage-license" || true
          SDKMANAGER=$(find "$ANDROID_HOME" -name sdkmanager -type f | head -n 1)
          if [ -n "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses || true
            yes | "$SDKMANAGER" "build-tools;33.0.1" "platforms;android-33" || true
          fi

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Clone Official Linphone Android Source (Latest Master from GitLab)
        run: |
          TARGET_BRANCH="${{ github.event.inputs.linphone_branch || 'master' }}"
          echo "Cloning Linphone Android branch: $TARGET_BRANCH from official GitLab: https://gitlab.linphone.org/BC/public/linphone-android.git"
          if git clone --depth 1 --branch "$TARGET_BRANCH" https://gitlab.linphone.org/BC/public/linphone-android.git linphone-android; then
            echo "Successfully cloned branch $TARGET_BRANCH from Linphone GitLab."
          elif git clone --depth 1 --branch "$TARGET_BRANCH" https://github.com/BelledonneCommunications/linphone-android.git linphone-android; then
            echo "Successfully cloned branch $TARGET_BRANCH from GitHub mirror."
          else
            echo "Branch $TARGET_BRANCH failed. Falling back to default branch..."
            git clone --depth 1 https://gitlab.linphone.org/BC/public/linphone-android.git linphone-android || git clone --depth 1 https://github.com/BelledonneCommunications/linphone-android.git linphone-android
          fi

      - name: Run Linphone Patcher (10 Calls + Headless Tel Intercept + Multi-Call Overlay Window)
        run: |
          python3 patch_linphone.py --target linphone-android

      - name: Configure Gradle Environment
        run: |
          cd linphone-android
          find . -type f \( -name "*.gradle" -o -name "*.kts" -o -name "*.properties" \) -exec sed -i 's|https://linphone.org/maven_repository|https://download.linphone.org/maven_repository|g' {} +
          mkdir -p ~/.gradle
          echo "org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -XX:+HeapDumpOnOutOfMemoryError" >> ~/.gradle/gradle.properties
          echo "org.gradle.parallel=true" >> ~/.gradle/gradle.properties
          echo "android.useAndroidX=true" >> gradle.properties
          echo "android.enableJetifier=true" >> gradle.properties

      - name: Build APK with Gradle
        run: |
          cd linphone-android
          chmod +x ./gradlew
          BUILD_TYPE="${{ github.event.inputs.build_type || 'debug' }}"
          GRADLE_FLAGS="-x test -x lint -x ktlintCheck -x ktlintFormat -x runKtlintCheckOverMainSourceSet -x runKtlintFormatOverMainSourceSet --stacktrace --no-daemon"
          if [ "$BUILD_TYPE" = "release" ]; then
            ./gradlew assembleRelease $GRADLE_FLAGS || ./gradlew assembleDebug $GRADLE_FLAGS
          else
            ./gradlew assembleDebug $GRADLE_FLAGS
          fi

      - name: Prepare APK Artifacts
        run: |
          mkdir -p artifacts
          FOUND_APK=$(find linphone-android/app/build/outputs/apk/ -type f -name "*.apk" | head -n 1)
          if [ -n "$FOUND_APK" ]; then
            echo "Found generated APK: $FOUND_APK"
            cp "$FOUND_APK" artifacts/Linphone-Custom-10Call-MessengerBubble-Debug.apk
            ls -lh artifacts/
          else
            echo "Error: No APK file was generated!"
            exit 1
          fi

      - name: Upload Linphone Custom APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Linphone-Custom-10Call-MessengerBubble-APK
          path: artifacts/Linphone-Custom-10Call-MessengerBubble-Debug.apk
          if-no-files-found: error
          retention-days: 30
